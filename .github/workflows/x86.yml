name: Build ImmortalWrt 25.12 x86-64 (daed)

# 不再定时构建：由 upstream-check.yml 检测到上游 ImmortalWrt 变化后，
# 更新 config/upstream-revision.txt 并 push，从而触发本工作流。
on:
  # 已改为 .223 本地构建（scripts/local-build.sh），此工作流仅作手动备用
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 25.12-SNAPSHOT
  PROFILE: generic
  ROOTFS_PARTSIZE: 1024
  EXTRA_IMAGE_NAME: daede

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd qemu-utils rsync curl

      - name: 构建固件
        env:
          PPPOE_USER: ${{ secrets.PPPOE_USER }}
          PPPOE_PASS: ${{ secrets.PPPOE_PASS }}
          ROOT_PASS:  ${{ secrets.ROOT_PASS }}
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: 收集产物
        id: collect
        run: |
          cd out
          ls -lah
          IMG=$(ls *squashfs-combined-efi.img.gz 2>/dev/null | head -1)
          MAN=$(ls *.manifest 2>/dev/null | head -1)
          echo "IMG=$IMG" >> "$GITHUB_OUTPUT"
          echo "MAN=$MAN" >> "$GITHUB_OUTPUT"
          echo "SHA=$(sha256sum "$IMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "SIZE=$(du -h "$IMG" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "PKGS=$(wc -l < "$MAN" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM=$(cat ../config/upstream-revision.txt 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-daede-x86-64
          path: |
            out/*squashfs-combined-efi.img.gz
            out/*.manifest
            out/sha256sums
          retention-days: 30

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x86-${{ github.run_number }}
          name: "x86-${{ github.run_number }} · ImmortalWrt 25.12 + daed"
          prerelease: true
          body: |
            ## ImmortalWrt 25.12-SNAPSHOT · x86-64 · daede

            ### 下载

            | 文件 | 说明 |
            |------|------|
            | `*squashfs-combined-efi.img.gz` | **刷机用**（EFI 启动，含分区表，dd 写入） |

            ### 镜像信息

            | 项目 | 值 |
            |------|-----|
            | 上游版本 | `${{ steps.collect.outputs.UPSTREAM }}` |
            | 内核 | 6.12.x（内置 BTF） |
            | 包数量 | ${{ steps.collect.outputs.PKGS }} |
            | 镜像大小 | ${{ steps.collect.outputs.SIZE }} |
            | 根分区 | ${{ env.ROOTFS_PARTSIZE }} MB |
            | SHA256 | `${{ steps.collect.outputs.SHA }}` |

            ### 开箱配置

            - LAN `192.168.2.1`（eth1–eth3 桥接）
            - WAN `eth0` PPPoE（凭据来自 Secrets）
            - flow offloading 开启 / IPv6 关闭
            - **daed** eBPF 代理（`:2023`）
            - **Lucky**（`:4443` 已放行 WAN）
            - **adblock-fast**（3 列表，506k+ 域名，周日 04:00 更新）
            - **banip**（dshield/firehol1/threat/greensnow，周日 03:00 更新）
            - **wtbwmon**（单实例修复）
            - **Server酱** luci-app-wechatpush
            - **fw-ota**（LuCI → 系统 → 固件升级）
            - Docker（`/mnt/data/docker`）
            - kmod-nft-fullcone（NAT1）

            ### OTA

            本镜像内置 OTA。刷入后可通过 `LuCI → 系统 → 固件升级 (OTA)` 在线升级。

            ```bash
            /usr/sbin/fw-ota check      # 0=有新版 1=已最新 2=出错
            /usr/sbin/fw-ota version    # 查看本地构建号
            ```

            ### 刷机

            ```bash
            gunzip -c *squashfs-combined-efi.img.gz | dd of=/dev/sda bs=4M status=progress conv=fsync
            ```

            > ⚠️ 整盘覆盖会清空数据分区。要保留 sda3 见 README 的「保留数据分区的写法」。

            ### 校验

            ```bash
            sha256sum -c sha256sums --ignore-missing
            ```
          files: |
            out/*squashfs-combined-efi.img.gz
            out/*.manifest
            out/sha256sums