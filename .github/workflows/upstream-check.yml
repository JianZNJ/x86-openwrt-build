name: Upstream Check (ImmortalWrt)

# 轮询上游 ImmortalWrt x86/64 的构建版本戳；一旦变化，
# 更新 config/upstream-revision.txt 并 push，从而触发 x86.yml 构建。

on:
  schedule:
    # 每 6 小时检查一次（避开整点）
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 25.12-SNAPSHOT
  UPSTREAM_URL: https://downloads.immortalwrt.org/releases/25.12-SNAPSHOT/targets/x86/64/version.buildinfo
  STAMP_FILE: config/upstream-revision.txt

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 读取本地版本戳
        id: local
        run: |
          if [ -f "$STAMP_FILE" ]; then
            OLD=$(tr -d '[:space:]' < "$STAMP_FILE")
          else
            OLD=""
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "本地: ${OLD:-<空>}"

      - name: 拉取上游版本戳
        id: remote
        run: |
          NEW=""
          for i in 1 2 3 4 5; do
            NEW=$(curl -fsSL --max-time 30 "$UPSTREAM_URL" 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$NEW" ]; then break; fi
            echo "第 $i 次拉取失败，5 秒后重试"
            sleep 5
          done
          if [ -z "$NEW" ]; then
            echo "::error::无法获取上游 version.buildinfo"
            exit 1
          fi
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "上游: $NEW"

      - name: 比对
        id: diff
        run: |
          OLD="${{ steps.local.outputs.old }}"
          NEW="${{ steps.remote.outputs.new }}"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化（$NEW）"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游已更新：${OLD:-<空>} → $NEW"
          fi

      - name: 更新版本戳并触发构建
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "${{ steps.remote.outputs.new }}" > "$STAMP_FILE"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$STAMP_FILE"
          git commit -m "chore(upstream): ImmortalWrt ${{ env.VERSION }} -> ${{ steps.remote.outputs.new }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "::notice::版本戳已更新，x86.yml 将由 push 自动触发"

      - name: 写入汇总
        run: |
          {
            echo "### 上游检测结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 本地 | ${{ steps.local.outputs.old }} |"
            echo "| 上游 | ${{ steps.remote.outputs.new }} |"
            echo "| 是否变化 | ${{ steps.diff.outputs.changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"