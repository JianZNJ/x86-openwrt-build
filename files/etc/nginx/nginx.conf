# nginx 主配置（手写，不走 uci 生成）
# 反代站点在 /etc/nginx/conf.d/*.conf

worker_processes auto;
user root;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ---------------------------------------------------------------
    # 审计日志格式：必须含 $remote_addr，否则无法定位访问来源
    # 开启于 2026-11-07，用于审计 4443 反代的对外访问
    # 日志在 tmpfs（/var/log 随重启清空），且带 16k 缓冲，开销可控
    # ---------------------------------------------------------------
    log_format audit '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time up="$upstream_addr"';

    access_log /var/log/nginx/access.log audit buffer=16k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # 原简洁格式保留备查
    log_format openwrt
        '$request_method $scheme://$host$request_uri => $status'
        ' (${body_bytes_sent}B in ${request_time}s) <- $http_referer';

    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_max_body_size 128M;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server_tokens off;

    include conf.d/*.conf;
}
