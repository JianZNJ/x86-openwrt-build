# ============================================================
#  反向代理（替代 Lucky）
#  证书：ACME /etc/acme/cloudzj.net_ecc/  (*.cloudzj.net)
#  端口：4443（防火墙 Allow-HTTPS-4443）
# ============================================================

ssl_certificate     /etc/acme/cloudzj.net_ecc/fullchain.cer;
ssl_certificate_key /etc/acme/cloudzj.net_ecc/cloudzj.net.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# 未匹配域名直接断开
server {
    listen      4443 ssl default_server;
    listen      [::]:4443 ssl default_server;
    server_name _;
    return      444;
}

# FNOS 飞牛 NAS
server {
    listen      4443 ssl;
    listen      [::]:4443 ssl;
    http2       on;
    server_name fnos.cloudzj.net;
    client_max_body_size 0;
    proxy_request_buffering off;
    location / {
        proxy_pass http://192.168.2.206:5666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

