# ============================================================
#  反向代理（替代 Lucky）
#  证书：ACME /etc/acme/cloudzj.net_ecc/  (*.cloudzj.net)
#  端口：4443（防火墙 Allow-HTTPS-4443）
#
#  安全响应头（2026-11-07 公网审计后加固）
#  nginx 的 add_header 只有在本层完全没有 add_header 时才继承上层，
#  因此统一写在各 server 块内，而不是 http 块。
#  上游应用已经自己发出的头一律不重复添加：
#    - XFO / nosniff / CSP 重复出现会让部分浏览器判为无效
#    - Referrer-Policy 重复出现时按最后一个取值，反而会覆盖上游更严格的策略
#  所以 hass / qb / pass 三个站只补 HSTS。
# ============================================================

ssl_certificate     /etc/acme/cloudzj.net_ecc/fullchain.cer;
ssl_certificate_key /etc/acme/cloudzj.net_ecc/cloudzj.net.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# 未匹配域名直接断开
server {
    listen      4443 ssl default_server;
    listen      [::]:4443 ssl default_server;
    server_name _;
    return      444;
}

# FNOS 飞牛 NAS  —— 上游不发任何安全头，全部由 nginx 补
server {
    listen      4443 ssl;
    listen      [::]:4443 ssl;
    http2       on;
    server_name fnos.cloudzj.net;
    client_max_body_size 0;
    proxy_request_buffering off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Content-Security-Policy   "frame-ancestors 'self'" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://192.168.2.206:5666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Home Assistant  —— 上游已发 XFO + nosniff + Referrer-Policy，只补 HSTS
